    Searches for locations based on a keyword
    ---
    tags:
      - locations
    parameters:
      - name: request
        in: body
        required: true
        requires:
          - search_key
        properties:
          search_key:
            type: string
        description: keyword to find in the database's locations table

    responses:
      404:
        description: No locations found!
      400:
        description: Not a valid JSON or missing search key
      200:
        description: Request completed successfully
        schema:
          type: array
          items:
            properties:
              __class__:
                type: string
              city_id:
                type: string
              created_at:
                type: string
                description: time of creation of the instance
              updated_at:
                type: string
                description: time of last update of the instance
              id:
                type: string
                description: The uuid of the state instance
              name:
                type: string
                description: State name
